[mod-name]
me-network-ae2-textures=ME Network - AE2 Textures

[mod-description]
me-network-ae2-textures=The graphics of ME Network: textures of Applied Energistics 2 in place of ME Network's own sprites, under CC BY-NC-SA 3.0 (AlgorithmX2 et al., Ridanisaurus Rid). ME Network requires this mod and comes with it; it is a mod of its own only because of its license. It replaces the icons of the storage cells, components and housing, the upgrade cards and the patterns, and the ME Controller, Drive, Chest, Interface, Pattern Provider, Molecular Assembler, Cell Workbench and Charger with AE2's blocks, the ME terminals and monitors with AE2's panels, the ME Import, Export and Storage Bus with AE2's bus fronts, the cable with AE2's Fluix glass cable, the blocks of a Crafting CPU with AE2's crafting blocks, the wireless access point, terminal, module and booster with AE2's, and gives ME Network's technologies AE2 icons.
