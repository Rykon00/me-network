[mod-name]
me-network-ae2-textures=ME Network - AE2 Textures

[mod-description]
me-network-ae2-textures=Optional graphics for ME Network: textures of Applied Energistics 2 in place of ME Network's own sprites, under CC BY-NC-SA 3.0 (AlgorithmX2 et al., Ridanisaurus Rid). Needs ME Network; ME Network never needs this mod. It replaces the icons of the storage cells, components and housing, the upgrade cards and the patterns, and the ME Drive, Chest, Interface, Molecular Assembler, Cell Workbench and Charger with AE2's blocks.
