[mod-setting-name]
me-network-krastorio2-recipes=Krastorio-2-Rezepte und -Technologien
me-network-space-exploration-recipes=Space-Exploration-Rezepte und -Technologien

[mod-setting-description]
me-network-krastorio2-recipes=Mit Krastorio 2 werden die ME-Blöcke aus dessen Materialien hergestellt (Quarz, Glas, Automatisierungskerne, Greiferteile, seltene Metalle, Imersit, ...) und auf dessen Forschungsstufen erforscht, bis zu den Materie-, Fortgeschrittenen- und Singularitäts-Forschungskarten für die größten Speicher. Aus: die Rezepte und Technologien von ME Network ohne Krastorio 2. Wirkt nicht mit Gregtorio Continued, dessen Rezepte Vorrang haben.
me-network-space-exploration-recipes=Mit Space Exploration werden die ME-Blöcke aus dessen Materialien hergestellt (Glas, Kryonitstäbe, schwere Träger, Lager und Verbundstoffe, Holmiumkabel, Quantenprozessoren, Naquiumwürfel, ...) und auf dessen Forschungsstufen erforscht: bis 64k vor der Rakete, Autocrafting und die Karten mit Raketenforschung, 256k mit Weltraumforschung, größere Speicher mit Materialforschung, die Crafting-Seite mit Energieforschung, die ME-Quantenbrücke mit Astronomie- und Energieforschung 3, die Singularitätszellen mit Tiefraumforschung. Aus: die Rezepte und Technologien von ME Network ohne Space Exploration (oder die von Krastorio 2). Im Weltraum bauen lassen sich die ME-Blöcke in beiden Fällen. Ohne Wirkung mit Gregtorio Continued, dessen Rezepte Vorrang haben.
