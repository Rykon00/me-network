[mod-setting-name]
me-network-krastorio2-recipes=Krastorio-2-Rezepte und -Technologien

[mod-setting-description]
me-network-krastorio2-recipes=Mit Krastorio 2 werden die ME-Blöcke aus dessen Materialien hergestellt (Quarz, Glas, Automatisierungskerne, Greiferteile, seltene Metalle, Imersit, ...) und auf dessen Forschungsstufen erforscht, bis zu den Materie-, Fortgeschrittenen- und Singularitäts-Forschungskarten für die größten Speicher. Aus: die Rezepte und Technologien von ME Network ohne Krastorio 2. Wirkt nicht mit Gregtorio Continued, dessen Rezepte Vorrang haben.
