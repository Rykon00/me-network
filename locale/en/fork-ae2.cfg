[technology-description]
me-network=Applied Energistics storage on top of the logistic network: ME Drives with 1k, 4k and 16k storage cells and the ME Terminal.
me-storage-64k=64k storage cells and drives.
me-storage-256k=256k storage cells and drives, advanced and acceleration cards.
me-autocrafting=ME Pattern Provider, ME Molecular Assembler and ME Crafting CPU: craft items and all their intermediate products from the ME network with one click in the ME Terminal.
me-fluid-storage=Fluids in the ME network: fluid storage cells and ME Fluid Drives with 1k, 4k, 16k and 64k cells, and the ME Fluid Interface to move fluids in and out. Recipes with fluids can be autocrafted.
me-fluid-storage-256k=256k fluid storage cells and drives.

