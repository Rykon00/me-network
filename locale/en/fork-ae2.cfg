[item-description]
fork-me-storage-cell=Storage cell of the ME network: put it into an ME Drive. __1__: __2__ bytes, up to __3__ item types; every type takes some bytes, every 8 items of a type one byte (up to __4__ items of a single type). The items stay in the cell when it is taken out of the drive.
fork-me-legacy-drive=ME Drive from before the ME rework. Place it to get an ME Drive with its four __1__ in the first slots.
me-drive=Holds up to 10 storage cells. Place it next to an ME cable or another ME block, open it and put cells into its slots.
fluix-cable=Places an ME Cable, which connects ME blocks on all four sides. Also a crafting ingredient.
me-controller=Runs an ME network: exactly one per network, needs power.
me-interface=Import and export point of the ME network for inserters and belts.
me-import-bus=Pulls items out of the machine or chest it faces into the ME network.
me-export-bus=Puts its filtered items from the ME network into the machine or chest it faces.
me-pattern-provider=Place it next to a machine inside an ME network. The recipe that machine has set becomes an autocrafting pattern of the network. For a furnace, open the provider and choose the recipe.
me-molecular-assembler=Assembler for item-only crafting recipes. Set a recipe and put a Pattern Provider next to it to make that recipe available for autocrafting.
me-crafting-cpu=Runs autocrafting jobs of its ME network. Every CPU runs one job at a time.
me-co-processing-cpu=Crafting CPU with co-processors: runs two autocrafting jobs at once, each twice as fast as on an ME Crafting CPU.
me-quantum-crafting-cpu=Runs four autocrafting jobs at once, each four times as fast as on an ME Crafting CPU.
me-level-maintainer=Keeps an amount of an item or fluid in stock: when the ME network holds less, it starts a crafting job for the difference.
me-circuit-interface=Puts the items and fluids of its ME network onto the circuit network.
fork-me-fluid-storage-cell=Fluid storage cell of the ME network: put it into an ME Drive like an item cell. __1__: __2__ bytes, up to __3__ fluid types; every type takes some bytes, every 8 units of a fluid one byte (up to __4__ units of a single fluid). The fluids stay in the cell when it is taken out of the drive; they are stored without temperature.
me-fluid-import-bus=Takes fluid out of the machine or tank it faces into the ME network.
me-fluid-export-bus=Puts its filtered fluids from the ME network into the machine or tank it faces.
me-fluid-interface=Tank of the ME network. Pipe fluids into it to store them in the network, or let it fill up with a fluid taken out of the network.

