[entity-description]
me-cable=Connects ME blocks and can be walked over: everything touching it on its four sides (cables, controller, drives, terminals, interfaces, buses, pattern providers, CPUs, ...) is in the same ME network. ME blocks touching each other connect without a cable.
me-underground-cable=Carries the ME network under up to __1__ tiles to another underground cable facing it. Rotate it so its arrow points along the run: above ground it connects only on the side opposite the arrow. Like ME Cables, it can be walked over.
me-network-controller=Runs the ME network it is connected to: a network needs exactly one controller with power (two are a conflict and stop the network). Uses 120 kW plus 4 kW for every drive, interface, bus, provider and fluid block of the network.
me-drive=Holds __1__ storage cells. Open it and click a slot with a cell in hand to put it in, click a filled slot to take the cell out (shift: into the inventory); clicking the drive with a cell in hand puts it into the first free slot. Cells keep their items when taken out. Mined: the cells come with it; destroyed: they drop on the ground.
me-network-interface=Import and export point of the ME network with __1__ slots. Unfiltered slots are imported (their items go into the network); a filtered slot (middle click a slot to set a filter) is kept filled from the network with its item up to a stack. Inserters put items in and take the filtered ones out. Filters are kept in blueprints and copied with the entity settings.
me-import-bus=Faces one machine or chest (rotate it): moves items from its output (a chest: from all of it) into the ME network, up to 64 items about every second. Open it to set up to 5 item filters; without filters it takes everything.
me-export-bus=Faces one machine or chest (rotate it): puts its filtered items from the ME network into the machine's input (up to a stack of each) or into the chest. Open it to set up to 5 item filters.
me-terminal=Needs power and an ME network. Open it to see everything stored in the network: left click takes a stack into the hand, right click one item, shift click a stack into the inventory; with an item in hand, a click stores it. Click an item of your inventory (shown below) to store all of it.
me-pattern-provider=Place it next to a machine (Molecular Assembler, any GT machine, furnace) inside an ME network. The recipe that machine has set becomes a pattern for autocrafting; furnaces have no recipe setting, so open the provider to choose the recipe for the furnaces next to it (without a choice, the recipe a furnace smelted last is used). The machine is fed and emptied by the network while a job runs. Recipes with fluids work once ME Fluid Storage is researched, as long as the fluid boxes the recipe uses have no pipes connected. Use dedicated machines: the network takes over their input and output.
me-molecular-assembler=Assembling machine for item-only crafting recipes (no fluids). Set a recipe and place an ME Pattern Provider next to it to use it for autocrafting. Needs power.
me-crafting-cpu=Needs power and an ME network. Runs one autocrafting job at a time; the job slots of all CPUs in the network are the number of parallel jobs. Jobs are started in the crafting tab of the ME Terminal or by an ME Level Maintainer. The upgrade planner swaps in the bigger CPUs (a running job pauses and goes on on the new one).
fork-me-crafting-cpu-tier=Needs power and an ME network. Runs __1__ autocrafting jobs at once and hands work to the pattern machines __2__ times as fast as an ME Crafting CPU (more machines busy at the same time). The upgrade planner swaps CPU tiers.
me-level-maintainer=Needs power and an ME network. Open it to choose an item or fluid and the amount to keep in stock. When the network holds less, it starts a crafting job for the difference, as soon as a pattern exists and a Crafting CPU has a free job slot, and waits until that job is done. The lamp's circuit condition switches it off; with "Amount from the circuit" the signal of the chosen item or fluid on its wires is the amount. The settings are copied with the entity settings and kept in blueprints.
me-circuit-interface=Puts the contents of its ME network onto the circuit wires connected to it: every item and fluid, or only the ones chosen as filters (open it). Fluids are rounded down to whole units. Refreshed about once a second; the signal list is written by the network, entries you add by hand are replaced. No power needed.
me-fluid-import-bus=Faces one machine or tank (rotate it): moves fluid from the machine's output boxes (a tank: all of it) into the ME network, up to 1000 units about every quarter second. Open it to set up to 5 fluid filters; without filters it takes every fluid.
me-fluid-export-bus=Faces one machine or tank (rotate it): puts its filtered fluids from the ME network into the machine's input boxes or the tank, at the fluid's default temperature. Open it to set up to 5 fluid filters.
me-fluid-interface=Tank-like import/export point of the ME network. Open it to choose import (everything in the tank, and in the pipes and tanks connected to it without a pump in between, goes into the network) or export (the network fills the tank, and what is connected to it, with the chosen fluid up to the fill level). Connect pumps and pipes as with any tank. The network stores fluids without temperature: what comes out has the default temperature of the fluid. Mode, fluid and level are copied with the entity settings and kept in blueprints.

