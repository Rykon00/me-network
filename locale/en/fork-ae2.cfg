me-network=Applied Energistics storage: 1k, 4k and 16k storage cells for the ME Drive, the ME Terminal and the ME Import and Export Bus. Connect them to an ME Controller with ME cables.
me-storage-64k=64k storage cells.
me-storage-256k=256k storage cells, advanced and acceleration cards.
me-autocrafting=ME Pattern Provider, ME Molecular Assembler and ME Crafting CPU: craft items and all their intermediate products from the ME network with one click in the ME Terminal.
me-fluid-storage=Fluids in the ME network: 1k, 4k, 16k and 64k fluid storage cells for the ME Drive, the ME Fluid Interface and the ME Fluid Import and Export Bus. Recipes with fluids can be autocrafted.
me-fluid-storage-256k=256k fluid storage cells.
me-automation=ME Level Maintainer (keeps an item or fluid in stock by autocrafting) and ME Circuit Interface (the network contents on the circuit network).
me-co-processing=ME Co-Processing Crafting CPU: two autocrafting jobs at once, twice as fast.
me-quantum-crafting=ME Quantum Crafting CPU: four autocrafting jobs at once, four times as fast.

