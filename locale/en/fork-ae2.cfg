[entity-description]
fork-me-drive=Network storage with __1__ slots (four __2__ storage cells). Works like a logistic storage chest: robots store items here, the ME Terminal and requesters take them out. Use the upgrade planner to swap in bigger cells.
me-interface=Import/export point of the ME network. Items inserted into it that are not requested are moved into ME Drives by robots; requested items are brought in by robots. "Trash unrequested" is switched on when you place it by hand.
me-terminal=Needs power and an ME network (ME Controller or roboport coverage). Open it to see everything stored in the network. Left click: take a stack, right click: take half a stack, shift click: take up to ten stacks. Items in hand can be stored.
me-controller=Creates an ME network: a logistic network area without robots. Place Roboports in the same network if items should be moved automatically. Connect it to the circuit network to read the network contents.
me-pattern-provider=Place it next to a machine (Molecular Assembler, any GT machine, furnace) inside an ME network. The recipe that machine has set becomes a pattern for autocrafting; furnaces have no recipe setting, so open the provider to choose the recipe for the furnaces next to it (without a choice, the recipe a furnace smelted last is used). The machine is fed and emptied by the network while a job runs. Recipes with fluids work once ME Fluid Storage is researched, as long as the fluid boxes the recipe uses have no pipes connected. Use dedicated machines: the network takes over their input and output.
me-molecular-assembler=Assembling machine for item-only crafting recipes (no fluids). Set a recipe and place an ME Pattern Provider next to it to use it for autocrafting. Needs power.
me-crafting-cpu=Needs power and an ME network. Runs one autocrafting job at a time, so the number of CPUs in the network is the number of parallel jobs. Jobs are started in the crafting tab of the ME Terminal.
fork-me-fluid-drive=Fluid storage of the ME network with room for __1__ units of fluid (four __2__ fluid storage cells). Any fluid of the network can be stored here, the ME Terminal shows the total. The fluids stay on the drive item when it is picked up (also by robots and the upgrade planner) and come back when it is placed again; a destroyed drive loses them, and so does taking the cells out of a loaded drive item. Use the upgrade planner to swap in bigger cells.
me-fluid-interface=Tank-like import/export point of the ME network. Open it to choose import (everything in the tank, and in the pipes and tanks connected to it without a pump in between, goes into the network) or export (the network fills the tank, and what is connected to it, with the chosen fluid up to the fill level). Connect pumps and pipes as with any tank. The network stores fluids without temperature: what comes out has the default temperature of the fluid.

[recipe-name]
fork-me-drive-disassembly=Take cells out: __1__

[recipe-description]
fork-me-fluid-drive-disassembly=Hand crafting only. Fluid still stored on the drive item goes into the ME Fluid Drives of the network you stand in, as far as they have room; the rest is kept as recovered fluid until an ME Fluid Drive takes it over.

