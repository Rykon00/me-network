[item-description]
me-1k-storage-cell=Storage housing with a 1k component. Four of them make an ME Drive with 64 slots.
me-4k-storage-cell=Storage housing with a 4k component. Four of them make an ME Drive with 128 slots.
me-16k-storage-cell=Storage housing with a 16k component. Four of them make an ME Drive with 256 slots.
me-64k-storage-cell=Storage housing with a 64k component. Four of them make an ME Drive with 512 slots.
me-256k-storage-cell=Storage housing with a 256k component. Four of them make an ME Drive with 1024 slots.
me-drive=Empty drive chassis. Add four storage cells to get a placeable ME Drive.
me-pattern-provider=Place it next to a machine inside an ME network. The recipe that machine has set becomes an autocrafting pattern of the network.
me-molecular-assembler=Assembler for item-only crafting recipes. Set a recipe and put a Pattern Provider next to it to make that recipe available for autocrafting.
me-crafting-cpu=Runs autocrafting jobs of its ME network. Every CPU runs one job at a time.

