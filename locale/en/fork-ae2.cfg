[entity-description]
fork-me-drive=Network storage with __1__ slots (four __2__ storage cells). Works like a logistic storage chest: robots store items here, the ME Terminal and requesters take them out. Use the upgrade planner to swap in bigger cells.
me-interface=Import/export point of the ME network. Items inserted into it that are not requested are moved into ME Drives by robots; requested items are brought in by robots. "Trash unrequested" is switched on when you place it by hand.
me-terminal=Needs power and an ME network (ME Controller or roboport coverage). Open it to see everything stored in the network. Left click: take a stack, right click: take half a stack, shift click: take up to ten stacks. Items in hand can be stored.
me-controller=Creates an ME network: a logistic network area without robots. Place Roboports in the same network if items should be moved automatically. Connect it to the circuit network to read the network contents.
me-pattern-provider=Place it next to a machine (Molecular Assembler, any GT machine, furnace) inside an ME network. The recipe that machine has set becomes a pattern for autocrafting; the machine is fed and emptied by the network while a job runs. Recipes with fluids are ignored. Use dedicated machines: the network takes over their input and output.
me-molecular-assembler=Assembling machine for item-only crafting recipes (no fluids). Set a recipe and place an ME Pattern Provider next to it to use it for autocrafting. Needs power.
me-crafting-cpu=Needs power and an ME network. Runs one autocrafting job at a time, so the number of CPUs in the network is the number of parallel jobs. Jobs are started in the crafting tab of the ME Terminal.

