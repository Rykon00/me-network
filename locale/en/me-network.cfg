[mod-setting-description]
me-network-io-visits-per-tick=The visits per tick of the ME Interfaces, Import Buses and Export Buses of the whole map are what is due: a block with work is visited before the machine or chest on its other side runs empty or full (the visit sees what it used or gathered since the last one), a block with nothing to do on that side only looks there now and then (the idle limit, the setting below), and a block waiting for the network (its item missing, the network full, no power) costs nothing until the network wakes it. This is the floor: the visits a tick makes even when fewer are due; it matters only while more is due than it says.
me-network-io-visits-per-tick-max=The ceiling of the interface and bus visits per tick, whatever the number of blocks: it bounds the script time of a big base. Above it, the blocks due earliest come first, and before them a block whose machine had run out; the others wait. Each visit costs about 0.05 to 0.15 ms (more when a block has gathered more to move).
me-network-storage-bus-visits-per-tick=The reads per tick of the storage buses of the whole map are what is due: a bus whose chest or tank changed is read again soon, one that did not change at a growing interval up to its idle limit (the setting below). This is the floor.
me-network-storage-bus-visits-per-tick-max=The ceiling of the storage bus reads per tick, whatever the number of buses: above it, the buses due earliest are read first, the others wait.
me-network-maintainer-checks-per-tick=The checks per tick of the level maintainers of the whole map are what is due: a maintainer with a job under way is checked within a second, a stocked one not at all until its item or fluid is taken from the network, its job ends or its settings change (one whose amount comes from the circuit network every 5 seconds). This is the floor.
me-network-maintainer-checks-per-tick-max=The ceiling of the level maintainer checks per tick, whatever their number: above it, the checks due earliest come first.
me-network-circuit-updates-per-second=How many circuit interfaces of the whole map write the network's contents per second at most (each one at most once a second, and only when the contents changed). An interface without a filter writes up to 1000 signals, which costs about 1 ms each time.
me-network-crafting-jobs-per-tick=The job steps per tick follow the running crafting jobs of the whole map (each job hands work to its machines every 20 ticks), as far as this floor and the ceiling allow. This is the floor.
me-network-crafting-jobs-per-tick-max=The ceiling of the crafting job steps per tick, whatever the number of jobs: above it, jobs take turns and run slower.
me-network-bus-items-per-second=What one Import or Export Bus moves per second at most (a bus that is visited less often moves more per visit).
me-network-bus-fluid-per-second=What one Import or Export Bus moves of a fluid per second at most.
me-network-idle-limit=An interface or bus with nothing to do on its machine's side (an empty source, a full target, no target) looks there with one cheap check instead of a visit, twice as long apart each time up to this many ticks (60 ticks = 1 second), and is visited at once when the check sees a change. It also wakes at once when its item comes into the network, its settings change or its target is built.
me-network-storage-bus-idle-limit=A storage bus whose chest or tank did not change waits up to this many ticks before it reads it again: the longest time until the network sees a change made by an inserter, a pump or a player.
