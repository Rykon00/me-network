[technology-description]
me-upgrade-cards=The upgrade cards of Applied Energistics and the ME Cell Workbench: Capacity, Overflow Destruction, Fuzzy and Inverter Card for the ME Storage Bus; Inverter, Fuzzy, Equal Distribution and Overflow Destruction Card for storage cells, put in at the ME Cell Workbench.
me-network=Applied Energistics storage: 1k, 4k and 16k storage cells for the ME Drive, the ME Terminal, the ME Import, Export and Storage Bus. Connect them to an ME Controller with ME cables.
me-storage-64k=64k storage cells.
me-storage-256k=256k storage cells, advanced and acceleration cards.
me-autocrafting=ME Pattern Provider, blank patterns, ME Molecular Assembler and the crafting blocks (crafting unit, 1k and 4k crafting storage, crafting monitor) to build Crafting CPUs: encode patterns in the ME Terminal, then craft items and all their intermediate products from the ME network with one click.
me-fluid-storage=Fluid storage cells for the ME Drive: 1k, 4k, 16k and 64k. The ME Interface and the ME Import, Export and Storage Bus handle fluids from the start; with fluid cells the network can store them. Recipes with fluids can be autocrafted.
me-fluid-storage-256k=256k fluid storage cells.
me-automation=ME Level Maintainer (keeps an item or fluid in stock by autocrafting) and ME Circuit Interface (the network contents on the circuit network).
me-co-processing=ME Crafting Co-Processing Unit (each one makes a Crafting CPU hand out work once more per step) and the 16k and 64k crafting storage for bigger jobs.
me-quantum-crafting=ME 256k Crafting Storage for the biggest autocrafting jobs.

