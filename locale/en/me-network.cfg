[entity-description]
me-cable=Connects ME blocks and can be walked over: everything touching it on its four sides (cables, controller, drives, terminals, interfaces, buses, pattern providers, CPUs, ...) is in the same ME network. ME blocks touching each other connect without a cable.
me-underground-cable=Carries the ME network under the ground to another underground cable facing it, up to __1__ tiles apart, like an underground pipe (hover or hold it to see the pairing). Rotate it so its arrow points along the run: above ground it connects only on the side opposite the arrow. Like ME Cables, it can be walked over.
me-network-controller=Runs the ME network it is connected to: a network needs exactly one controller with power (two are a conflict and stop the network). Uses 120 kW plus 4 kW for every drive, interface, bus and provider of the network.
me-drive=Holds __1__ storage cells. Open it and click a slot with a cell in hand to put it in, click a filled slot to take the cell out (shift: into the inventory); clicking the drive with a cell in hand puts it into the first free slot. Cells keep their items when taken out. Mined: the cells come with it; destroyed: they drop on the ground.
me-network-interface=Import and export point of the ME network with __1__ slots for inserters and belts, and a tank on each of its four sides for pipes. Open it to set up to 9 rows, each an item or a fluid with an amount: the network keeps that many of each item in the interface and fills the sides tied to a fluid row with that fluid. Everything else put in (items, and fluid piped into a side) goes into the network. Each side imports (the default), is off, or keeps a fluid row: up to four fluids at once. The rows and sides are kept in blueprints and copied with the entity settings.
me-import-bus=Faces one machine, chest or tank (rotate it): moves items from its output (a chest: from all of it) and fluid from its output boxes (a tank: all of it) into the ME network, up to 64 items and 1000 units of fluid about every second. Open it to set up to 9 filters, items and fluids; without filters it takes everything.
me-export-bus=Faces one machine, chest or tank (rotate it): puts its filtered items from the ME network into the machine's input (up to a stack of each) or into the chest, and its filtered fluids into the machine's input boxes or the tank, at the fluid's default temperature. Open it to set up to 9 filters, items and fluids.
me-cell-workbench=Holds one storage cell: set its partition, put upgrade cards into it (Inverter, Fuzzy, Equal Distribution, Overflow Destruction) or take them out. Needs neither the ME network nor power.
me-storage-bus=Faces one chest, logistic chest or cargo wagon, or one storage tank (rotate it): the inventory, or the fluid of the tank and of every pipe and tank connected to it (its fluid segment), becomes storage of the ME network. The terminal shows what is in it, autocrafting and export take from it, and the network stores in it by its filters and priority. Open it to set filters (items and fluids), the priority and read/write mode, and to put in upgrade cards (capacity, inverter, fuzzy, overflow destruction). One bus per inventory or fluid segment; a bus facing an ME block does nothing.
me-terminal=Needs power and an ME network. Open it to see everything stored in the network: left click takes a stack into the hand, right click one item, shift click a stack into the inventory; with an item in hand, a click stores it. Click an item of your inventory (shown below) to store all of it.
me-pattern-provider=Holds 9 encoded patterns (open it and click a slot with a pattern in hand; clicking the provider with a pattern in hand puts it into the first free slot). Each pattern is an autocrafting pattern of the ME network. A crafting pattern sets its recipe on an assembling machine next to the provider (one machine serves many patterns, one job at a time); a processing pattern pushes its inputs into a furnace, a machine with its own recipe or a chest next to it, and its outputs are taken from the machine or come back into the network (import bus, interface). Recipes with fluids work once ME Fluid Storage is researched, as long as the fluid boxes they use have no pipes connected. Use dedicated machines: the network takes over their input, output and recipe. Mined: the patterns come with it; destroyed: they drop on the ground.
me-molecular-assembler=Assembling machine for item-only crafting recipes (no fluids). Place an ME Pattern Provider with crafting patterns next to it: the network sets the recipe of each job. Needs power.
me-crafting-cpu=Legacy block: can no longer be crafted (Crafting CPUs are now built from crafting blocks), keeps working. Needs power and an ME network. Runs one autocrafting job at a time, of any size. The upgrade planner swaps the legacy tiers (a running job pauses and goes on on the new one).
fork-me-crafting-cpu-tier=Legacy block: can no longer be crafted (Crafting CPUs are now built from crafting blocks), keeps working. Needs power and an ME network. Runs __1__ autocrafting jobs at once, of any size, and hands work to the pattern machines __2__ times as fast as an ME Crafting CPU. The upgrade planner swaps the legacy tiers.
me-crafting-unit=Crafting CPU block (1x1): fills a Crafting CPU to a solid rectangle. A Crafting CPU is any group of touching crafting blocks that is a solid rectangle with at least one crafting storage; it runs one autocrafting job, of at most its crafting storage in bytes. Its blocks are ME network members and draw their power through the ME Controller.
fork-me-crafting-storage=Crafting CPU block (1x1) with __1__ bytes of crafting storage: the bytes of all crafting storages of a Crafting CPU are the biggest job it can run (1 byte per item, 1 per 10 fluid units of every step, more in the plan preview). A Crafting CPU is any group of touching crafting blocks that is a solid rectangle with at least one crafting storage; it runs one job. Its blocks draw their power through the ME Controller.
me-crafting-co-processing-unit=Crafting CPU block (1x1): every co-processor makes its Crafting CPU hand work to the pattern machines once more per step (1 + co-processors times as fast; at most 16 count). A Crafting CPU is any group of touching crafting blocks that is a solid rectangle with at least one crafting storage.
me-crafting-monitor=Crafting CPU block (1x1): shows the item or fluid its Crafting CPU is crafting and the amount. A Crafting CPU is any group of touching crafting blocks that is a solid rectangle with at least one crafting storage.
me-level-maintainer=Needs power and an ME network. Open it to choose an item or fluid and the amount to keep in stock. When the network holds less, it starts a crafting job for the difference, as soon as a pattern exists and a Crafting CPU has a free job slot, and waits until that job is done. The lamp's circuit condition switches it off; with "Amount from the circuit" the signal of the chosen item or fluid on its wires is the amount. The settings are copied with the entity settings and kept in blueprints.
me-circuit-interface=Puts the contents of its ME network onto the circuit wires connected to it: every item and fluid, or only the ones chosen as filters (open it). Fluids are rounded down to whole units. Refreshed about once a second; the signal list is written by the network, entries you add by hand are replaced. No power needed.
me-fluid-import-bus=Old ME block, replaced by the unified one when the game is loaded.
me-fluid-export-bus=Old ME block, replaced by the unified one when the game is loaded.
me-fluid-storage-bus=Old ME block, replaced by the unified one when the game is loaded.
me-fluid-interface=Old ME block, replaced by the ME Interface when the game is loaded.

