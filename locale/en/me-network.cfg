[item-description]
me-basic-card=Component of the Capacity Card and the Overflow Destruction Card.
me-advanced-card=Component of the Fuzzy Card, the Inverter Card and the Equal Distribution Card.
me-capacity-card=Upgrade card. In an ME Storage Bus (up to 5): 9 more filters each (18 without a card, 63 with five).
me-overflow-destruction-card=[color=red][font=default-bold]DESTROYS ITEMS AND FLUIDS.[/font][/color] Upgrade card. In an ME Storage Bus: whatever the network stores into it and does not fit into its chest or tank is [color=red]destroyed[/color] (only what its filters let in, and only while it faces a chest or tank). In a storage cell (ME Cell Workbench): whatever the network stores into the cell and does not fit (or exceeds a kind's share with an Equal Distribution Card) is [color=red]destroyed[/color]. Stops a farm from backing up. Use it on storage of low priority.
me-fuzzy-card=Upgrade card. In an ME Storage Bus or an item storage cell (ME Cell Workbench): a filter or partition matches its item in every quality.
me-inverter-card=Upgrade card. In an ME Storage Bus or a storage cell (ME Cell Workbench): the filters or the partition become a blacklist (everything except them).
me-equal-distribution-card=Upgrade card for storage cells (ME Cell Workbench): every kind of item or fluid gets the same share of the cell's bytes, so one kind cannot fill it.
me-cell-workbench=Puts upgrade cards into storage cells and sets their partition. Needs neither the ME network nor power.
fork-me-storage-cell=Storage cell of the ME network: put it into an ME Drive. __1__: __2__ bytes, up to __3__ item types; every type takes some bytes, every 8 items of a type one byte (up to __4__ items of a single type). The items stay in the cell when it is taken out of the drive.
fork-me-legacy-drive=ME Drive from before the ME rework. Place it to get an ME Drive with its four __1__ in the first slots.
me-drive=Holds up to 10 storage cells. Place it next to an ME cable or another ME block, open it and put cells into its slots.
fluix-cable=Places an ME Cable, which connects ME blocks on all four sides. Also a crafting ingredient.
me-controller=Runs an ME network: exactly one per network, needs power.
me-interface=Import and export point of the ME network: items for inserters and belts, fluids for pipes on its four sides.
me-import-bus=Pulls items and fluids out of the machine, chest or tank it faces into the ME network.
me-export-bus=Puts its filtered items and fluids from the ME network into the machine, chest or tank it faces.
me-storage-bus=Makes the chest or cargo wagon it faces, or the fluid of the tank it faces, part of the ME network's storage.
me-pattern-provider=Holds 9 encoded patterns; each is an autocrafting pattern of its ME network. Place it next to the machines (or a chest) that should do the work.
me-blank-pattern=Encode it in the Patterns tab of the ME Terminal: it becomes an encoded pattern.
me-encoded-pattern=An autocrafting pattern: put it into an ME Pattern Provider. Clear it in the Patterns tab of the ME Terminal (hold it and click "Clear pattern in hand") to get the blank pattern back.
me-molecular-assembler=Assembler for item-only crafting recipes. Place an ME Pattern Provider with crafting patterns next to it: the provider sets the recipe of each job.
fork-me-legacy-cpu=Legacy Crafting CPU: can no longer be crafted, but it can still be placed and keeps working as before (several jobs of any size). New Crafting CPUs are built from crafting blocks: a solid rectangle of crafting storage, crafting units, co-processing units and monitors.
me-level-maintainer=Keeps an amount of an item or fluid in stock: when the ME network holds less, it starts a crafting job for the difference.
me-circuit-interface=Puts the items and fluids of its ME network onto the circuit network.
fork-me-fluid-storage-cell=Fluid storage cell of the ME network: put it into an ME Drive like an item cell. __1__: __2__ bytes, up to __3__ fluid types; every type takes some bytes, every 8 units of a fluid one byte (up to __4__ units of a single fluid). The fluids stay in the cell when it is taken out of the drive; they are stored without temperature.
fork-me-unified=Old ME block: the __1__ handles fluids now. Placing this builds an __1__.

