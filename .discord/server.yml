# This mod's category on the "Gregtorio & ME Network" Discord server.
#
# A fragment for https://github.com/Rykon00/gregtorio-me-network_discord-bot: that repository holds
# the tool, the server-wide settings and the reference for this file. Changes here are planned on
# the pull request and applied when it is merged (.github/workflows/discord.yml).
# Nothing is deleted by removing it from this file; a rename needs previous_names.

categories:
  - name: ME Network
    position: 30
    channels:
      - name: me-network-chat
        topic: >-
          Everything about ME Network.
          Mod portal: https://mods.factorio.com/mod/me-network
      - name: me-network-help
        type: forum
        topic: |-
          Questions about ME Network: storage, buses, interfaces, autocrafting, fluids.

          - Search first; your question may have an answer already.
          - Say which versions of ME Network and Factorio you play and whether you play with Gregtorio Continued.
          - Screenshots help; for performance questions add the output of /me-stats.
          - Found a bug? Confirmed bugs go to https://github.com/Rykon00/me-network/issues with your log file and, if you can, a save.
        tags: [question, storage, buses, autocrafting, fluids, performance, bug, solved]
        sort: latest_activity
        layout: list
      - name: me-network-releases
        type: announcement
        read_only: true
        writers: [Maintainer]
        topic: New versions of ME Network. Follow this channel to get them in your own server.
