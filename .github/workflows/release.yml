name: Build & Release

# Every push and pull request: Lua syntax check and the build of both zips (issue #239): me-network (GPLv3,
# the repository without ae2-textures/) and the optional texture mod me-network-ae2-textures (CC BY-NC-SA 3.0,
# ae2-textures/ alone); tools/build.py fails when a zip breaks that split. Pull requests into main that change
# the game must also change changelog.txt, and those that change the texture mod ae2-textures/changelog.txt
# (label "no changelog" to skip).
# Branches: main is development; upstream/release is the published state. A release pull request
# into upstream/release (from a branch made from main, merged with a merge commit) must bump
# "version" in info.json (no tag vX.Y.Z yet) and add its changelog.txt section. When it is merged,
# this workflow creates the GitHub release vX.Y.Z with the me-network zip, uploads it to the
# Factorio mod portal and fast-forwards main to the merged upstream/release, so main has the
# version bump too. If main has commits that upstream/release lacks, the push is rejected and the
# run only warns: then merge upstream/release into main by hand.
# A tag vX.Y.Z pushed by hand releases too.
# The texture mod (issue #243) has a version of its own, checked by tools/release_textures.py in the
# release pull request and again when releasing: if anything under ae2-textures/ changed since the
# last release tag, ae2-textures/info.json needs a version no earlier release used (no tag, not on the
# portal) and ae2-textures/changelog.txt a section for it. Only such a new version is attached to the
# GitHub release and uploaded to its own portal page (mods.factorio.com/mod/me-network-ae2-textures);
# a release where ae2-textures/ did not change attaches and uploads no texture zip.
# A texture-only release (issue #245): a release pull request may keep me-network's version (tag vX.Y.Z
# exists) when nothing the me-network zip holds changed since that tag and the texture version is new.
# Its merge creates the tag me-network-ae2-textures-vX.Y.Z (the texture version; not "v*", so it
# triggers nothing) and a GitHub release with the texture zip and the texture notes alone (not marked
# as the latest release), uploads only the texture zip and announces only the texture mod.
# Both uploads run tools/portal_upload.sh, each in a step of its own; it takes the mod name and
# version from the zip's own info.json and refuses a zip of another mod than the step's, so neither
# zip can reach the other's page. They need the repository secret FACTORIO_MOD_API_KEY (an API key
# from https://factorio.com/profile with the "ModPortal: Upload Mods" permission, account-wide, so
# one key serves both mods). Without it, or when the portal already has that version, an upload is skipped.
# After a release the job "announce" posts a digest of the version's changelog.txt section to the
# Discord channel #me-network-releases, and a second one of ae2-textures/changelog.txt when the texture
# version is new (secret DISCORD_BOT_TOKEN; without it the job only warns). It is a job
# of its own, so a problem with Discord never touches the release, and it can be re-run alone:
# announcing a version twice does nothing. The tool is https://github.com/Rykon00/gregtorio-me-network_discord-bot.

on:
  push:
    branches: [main, upstream/release]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.rel.outputs.release }}
      name: ${{ steps.rel.outputs.name }}
      version: ${{ steps.rel.outputs.version }}
      textures_new: ${{ steps.rel.outputs.textures_new }}
      textures_name: ${{ steps.rel.outputs.textures_name }}
      textures_title: ${{ steps.rel.outputs.textures_title }}
      textures_version: ${{ steps.rel.outputs.textures_version }}
      textures_only: ${{ steps.rel.outputs.textures_only }}
      textures_tag: ${{ steps.rel.outputs.textures_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Changelog entry for game changes (pull requests into main)
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && !contains(github.event.pull_request.labels.*.name, 'no changelog')
        run: |
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$CHANGED" | grep -qE '^(prototypes/|scripts/|locale/|graphics/|control\.lua|data(-updates|-final-fixes)?\.lua|settings.*\.lua)'; then
            if ! echo "$CHANGED" | grep -qx 'changelog.txt'; then
              echo "::error::This pull request changes the game but not changelog.txt. Add its lines to the topmost section (the next version), or set the label 'no changelog'."
              exit 1
            fi
          fi
          if echo "$CHANGED" | grep -qE '^ae2-textures/(graphics/|locale/|[^/]+\.lua$)'; then
            if ! echo "$CHANGED" | grep -qx 'ae2-textures/changelog.txt'; then
              echo "::error::This pull request changes the texture mod but not ae2-textures/changelog.txt. Add its lines to the topmost section, or set the label 'no changelog'."
              exit 1
            fi
          fi

      - name: Lua syntax check (loaded files only)
        run: |
          sudo apt-get install -y -qq lua5.4 >/dev/null
          python3 tools/check_syntax.py --loaded

      - name: Decide whether this is a release
        id: rel
        run: |
          NAME=$(python3 -c "import json;print(json.load(open('info.json'))['name'])")
          V=$(python3 -c "import json;print(json.load(open('info.json'))['version'])")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "zip=dist/${NAME}_${V}.zip" >> "$GITHUB_OUTPUT"
          TT=$(python3 -c "import json;i=json.load(open('ae2-textures/info.json'));print(i['name']+'-v'+i['version'])")
          RELEASE=false
          ONLY=false
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != info.json version $V"; exit 1; }
            RELEASE=true
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" = "upstream/release" ]; then
            if ! git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
              echo "info.json version $V has no tag yet: release."
              RELEASE=true
            elif git rev-parse -q --verify "refs/tags/$TT" >/dev/null; then
              echo "Tags v$V and $TT exist already: no release."
            else
              # issue #245: me-network is released already; a new texture version is a texture-only release
              rm -f "$RUNNER_TEMP/textures.out"
              python3 tools/release_textures.py --texture-only --release-tag "$TT" --output "$RUNNER_TEMP/textures.out"
              if grep -qx 'textures_new=true' "$RUNNER_TEMP/textures.out"; then
                echo "Tag v$V exists, the texture version is new: texture-only release $TT."
                cat "$RUNNER_TEMP/textures.out" >> "$GITHUB_OUTPUT"
                RELEASE=true
                ONLY=true
              else
                echo "Tag v$V exists and the texture version is not new: no release."
              fi
            fi
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "textures_only=$ONLY" >> "$GITHUB_OUTPUT"
          # issue #243: is the texture mod's version new (attach and upload it)? A broken version stops the release.
          if [ "$RELEASE" = true ] && [ "$ONLY" = false ]; then
            python3 tools/release_textures.py --release-tag "v$V" --output "$GITHUB_OUTPUT"
          fi

      - name: Release pull request checks (version bumps, changelogs)
        if: github.event_name == 'pull_request' && github.base_ref == 'upstream/release'
        run: |
          V=${{ steps.rel.outputs.version }}
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            # issue #245: a texture-only release keeps me-network's version
            TT=$(python3 -c "import json;i=json.load(open('ae2-textures/info.json'));print(i['name']+'-v'+i['version'])")
            if git rev-parse -q --verify "refs/tags/$TT" >/dev/null; then
              echo "::error::info.json version $V and the texture version (tag $TT) are released already. Bump a version for this release."
              exit 1
            fi
            rm -f "$RUNNER_TEMP/textures.out"
            python3 tools/release_textures.py --texture-only --release-tag "$TT" --output "$RUNNER_TEMP/textures.out"
            if ! grep -qx 'textures_new=true' "$RUNNER_TEMP/textures.out"; then
              echo "::error::info.json version $V is released already (tag v$V) and ae2-textures/ has no new version: nothing to release. Bump the version for this release."
              exit 1
            fi
            echo "Merging this pull request makes the texture-only release $TT (GitHub release and mod portal); me-network stays $V."
            exit 0
          fi
          grep -q "^Version: $V$" changelog.txt || { echo "::error::changelog.txt has no section 'Version: $V'."; exit 1; }
          python3 tools/release_textures.py --release-tag "v$V"
          echo "Merging this pull request releases $V (GitHub release and mod portal)."

      - name: Build both zips (me-network, me-network-ae2-textures)
        run: |
          python3 tools/build.py --portal ${{ steps.rel.outputs.textures_only == 'true' && '--texture-notes-only' || steps.rel.outputs.textures_new != 'true' && '--no-texture-notes' || '' }}
          for z in dist/*.zip; do echo "== $z"; python3 -c "import sys,zipfile;print('\n'.join(zipfile.ZipFile(sys.argv[1]).namelist()))" "$z"; done

      - uses: actions/upload-artifact@v4
        with:
          name: mod-zips
          path: dist/*.zip

      - name: GitHub release
        if: steps.rel.outputs.release == 'true' && steps.rel.outputs.textures_only != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.rel.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.rel.outputs.version }}
          files: |
            ${{ steps.rel.outputs.zip }}
            ${{ steps.rel.outputs.textures_attach }}
          body_path: dist/release-notes.md

      # issue #245: a texture-only release has a tag of its own and only the texture zip and notes
      - name: GitHub release (texture-only)
        if: steps.rel.outputs.release == 'true' && steps.rel.outputs.textures_only == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.textures_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.rel.outputs.textures_title }} ${{ steps.rel.outputs.textures_version }}
          files: ${{ steps.rel.outputs.textures_zip }}
          body_path: dist/release-notes.md
          make_latest: false

      # tools/portal_upload.sh takes the mod name from the zip's info.json and refuses a zip that is not of $MOD
      - name: Upload me-network to the Factorio mod portal
        if: steps.rel.outputs.release == 'true' && steps.rel.outputs.textures_only != 'true'
        env:
          API_KEY: ${{ secrets.FACTORIO_MOD_API_KEY }}
          MOD: ${{ steps.rel.outputs.name }}
          ZIP: ${{ steps.rel.outputs.zip }}
        run: bash tools/portal_upload.sh "$ZIP" "$MOD"

      # issue #243: the texture mod (CC BY-NC-SA 3.0) to its own page, only a new version, with the same key
      - name: Upload the texture mod to the Factorio mod portal
        if: steps.rel.outputs.release == 'true' && steps.rel.outputs.textures_new == 'true'
        env:
          API_KEY: ${{ secrets.FACTORIO_MOD_API_KEY }}
          MOD: ${{ steps.rel.outputs.textures_name }}
          ZIP: ${{ steps.rel.outputs.textures_zip }}
        run: bash tools/portal_upload.sh "$ZIP" "$MOD"

      - name: Fast-forward main to the release
        if: github.event_name == 'push' && github.ref_name == 'upstream/release'
        run: |
          git push origin "HEAD:refs/heads/main" || echo "::warning::main has commits that upstream/release lacks: merge upstream/release into main by hand."

  announce:
    name: Announce on Discord
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: mod

      - uses: actions/checkout@v4
        with:
          repository: Rykon00/gregtorio-me-network_discord-bot
          path: tool

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Post the release to #me-network-releases
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          MOD: ${{ needs.build.outputs.name }}
          VERSION: ${{ needs.build.outputs.version }}
          TEXTURES_NEW: ${{ needs.build.outputs.textures_new }}
          TEXTURES_MOD: ${{ needs.build.outputs.textures_name }}
          TEXTURES_TITLE: ${{ needs.build.outputs.textures_title }}
          TEXTURES_VERSION: ${{ needs.build.outputs.textures_version }}
          TEXTURES_ONLY: ${{ needs.build.outputs.textures_only }}
          TEXTURES_TAG: ${{ needs.build.outputs.textures_tag }}
        run: |
          if [ -z "$DISCORD_BOT_TOKEN" ]; then
            echo "::warning::Secret DISCORD_BOT_TOKEN is not set: skipping the Discord announcement."
            exit 0
          fi
          python -m pip install --quiet -r tool/requirements.txt
          status=0
          # issue #245: a texture-only release announces the texture mod alone, its release page under its own tag
          RELEASE_TAG="v$VERSION"
          [ "$TEXTURES_ONLY" = true ] && RELEASE_TAG="$TEXTURES_TAG"
          [ "$TEXTURES_ONLY" = true ] || python tool/discord_announce.py \
            --guild-config tool/server.yml \
            --channel me-network-releases --title "ME Network" --version "$VERSION" \
            --changelog mod/changelog.txt \
            --link "Full changelog=https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION" \
            --link "Mod portal=https://mods.factorio.com/mod/$MOD" \
            --summary-file "$RUNNER_TEMP/announce.md" || status=$?
          [ -f "$RUNNER_TEMP/announce.md" ] && cat "$RUNNER_TEMP/announce.md" >> "$GITHUB_STEP_SUMMARY"
          # issue #243: a post of its own for the texture mod, only when this release made its version new
          if [ "$TEXTURES_NEW" = true ]; then
            python tool/discord_announce.py \
              --guild-config tool/server.yml \
              --channel me-network-releases --title "$TEXTURES_TITLE" --version "$TEXTURES_VERSION" \
              --changelog mod/ae2-textures/changelog.txt \
              --link "Full changelog=https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" \
              --link "Mod portal=https://mods.factorio.com/mod/$TEXTURES_MOD" \
              --summary-file "$RUNNER_TEMP/announce-textures.md" || status=$?
            [ -f "$RUNNER_TEMP/announce-textures.md" ] && cat "$RUNNER_TEMP/announce-textures.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
